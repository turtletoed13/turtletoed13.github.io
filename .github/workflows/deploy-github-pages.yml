name: Deploy NOLINE to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm install

      - name: Build NOLINE
        run: npm run build

      - name: Prepare static branch payload
        run: |
          find out -type f -name '*.txt' -delete
          rm -rf out/models/vehicles/arashi/source
          touch out/.nojekyll
          test -f out/index.html

      - name: Sync static payload into branch root
        if: ${{ !contains(github.event.head_commit.message, '[pages-sync]') }}
        run: |
          rm -rf ./_next ./images ./models ./404 ./_not-found
          rm -f ./index.html ./404.html ./.nojekyll ./config/index.html
          cp -R out/. .

          git config user.name "MTF_OPERATOR"
          git config user.email "192378879+turtletoed13@users.noreply.github.com"
          git add -- .nojekyll index.html 404.html 404 _not-found _next config/index.html images models

          if git diff --cached --quiet; then
            echo "Static payload is already current."
            exit 0
          fi

          git commit -m "Publish NOLINE static Pages payload [pages-sync]"
          git push origin HEAD:main

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy NOLINE
        id: deployment
        uses: actions/deploy-pages@v5
